name: Customer Churn CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: seymat/customer-churn-ai

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      LOG_LEVEL: INFO
      API_VERSION: 1.0.0
      MODEL_VERSION: test-1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        run: |
          pytest -v

  build:
    # Testler gecmeden build baslamaz.
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (tag = commit SHA)
        run: |
          docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Smoke test the image
        run: |
          docker run -d --name churn-smoke -p 8000:8000 "$IMAGE_NAME:${{ github.sha }}"

          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "API ayakta"
              break
            fi
            sleep 2
          done

          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/metrics > metrics.txt
          grep -q "customer_churn_" metrics.txt
          echo "Smoke test basarili"

      - name: Show container logs on failure
        if: failure()
        run: docker logs churn-smoke

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"