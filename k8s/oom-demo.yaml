apiVersion: v1
kind: Pod

metadata:
  name: memory-demo
  namespace: customer-churn-ai

spec:
  restartPolicy: Never

  containers:
    - name: memory-demo
      image: seymat/customer-churn-ai:1.0.2
      imagePullPolicy: IfNotPresent

      command:
        - python
        - -c
        - |
          blocks = []

          while True:
              blocks.append(
                  bytearray(10 * 1024 * 1024)
              )

      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"

        limits:
          cpu: "100m"
          memory: "64Mi"