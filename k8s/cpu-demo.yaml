apiVersion: v1
kind: Pod

metadata:
  name: cpu-demo
  namespace: customer-churn-ai

spec:
  restartPolicy: Never

  containers:
    - name: cpu-demo
      image: seymat/customer-churn-ai:1.0.2
      imagePullPolicy: IfNotPresent

      command:
        - python
        - -c
        - |
          while True:
              pass

      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"

        limits:
          cpu: "100m"
          memory: "128Mi"