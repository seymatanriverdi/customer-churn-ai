apiVersion: v1
kind: Pod

metadata:
  name: storage-demo
  namespace: customer-churn-ai

spec:
  containers:
    - name: storage-demo
      image: seymat/customer-churn-ai:1.0.2
      imagePullPolicy: IfNotPresent

      command:
        - sh
        - -c
        - sleep 3600

      volumeMounts:
        - name: mlflow-storage
          mountPath: /data

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

  volumes:
    - name: mlflow-storage
      persistentVolumeClaim:
        claimName: mlflow-storage-pvc