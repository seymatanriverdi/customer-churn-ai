apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: customer-churn-ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      containers:
        - name: mlflow
          image: seymat/customer-churn-ai:1.0.2
          imagePullPolicy: IfNotPresent

          command:
            - mlflow

          args:
            - server
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --backend-store-uri
            - "sqlite:////mlflow/mlflow.db"
            - --artifacts-destination
            - "/mlflow/artifacts"
            - --serve-artifacts
            - --workers
            - "1"
            - --allowed-hosts
            - "*"

          ports:
            - name: http
              containerPort: 5000

          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-storage-pvc